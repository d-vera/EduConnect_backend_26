app {
  server {
    host = "0.0.0.0"
    port = 8080
    port = ${?PORT}
    cors {
      allowedOrigins = ["http://localhost:4200", "http://127.0.0.1:4200"]
    }
  }

  database {
    url = "jdbc:postgresql://localhost:5432/educonnect"
    url = ${?DB_JDBC_URL}
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    name = "educonnect"
    name = ${?DB_NAME}
    user = "postgres"
    user = ${?DB_USER}
    password = "password"
    password = ${?DB_PASSWORD}
    maximumPoolSize = 10
  }
}

# Quill Postgres DataSource configuration using HikariCP standard properties
database {
  driverClassName = "org.postgresql.Driver"
  jdbcUrl = "jdbc:postgresql://127.0.0.1:5432/educonnect"
  username = "postgres"
  username = ${?DB_USER}
  password = "password"
  password = ${?DB_PASSWORD}
  maximumPoolSize = 10
  connectionTimeout = 30000
}
